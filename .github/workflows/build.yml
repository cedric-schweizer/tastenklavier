name: App bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Klangbibliothek vorhanden?
        run: ls -la /System/Library/Components/CoreAudio.component/Contents/Resources/gs_instruments.dls

      - name: Kompilieren (Apple-Chip und Intel)
        run: |
          mkdir -p build
          for ARCH in arm64 x86_64; do
            swiftc -O -swift-version 5 -target ${ARCH}-apple-macos13.0 Sources/*.swift -o build/Tastenklavier-$ARCH
          done
          lipo -create build/Tastenklavier-arm64 build/Tastenklavier-x86_64 -output build/Tastenklavier

      - name: App-Paket zusammenstellen
        run: |
          APP=build/Tastenklavier.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp build/Tastenklavier $APP/Contents/MacOS/
          sed -e "s/VERSION/$VERSION/" -e "s/BUILD/$GITHUB_RUN_NUMBER/" Resources/Info.plist > $APP/Contents/Info.plist
          ICONSET=build/AppIcon.iconset
          mkdir -p $ICONSET
          for S in 16 32 128 256 512; do
            sips -z $S $S Resources/AppIcon.png --out $ICONSET/icon_${S}x${S}.png >/dev/null
            D=$((S*2)); sips -z $D $D Resources/AppIcon.png --out $ICONSET/icon_${S}x${S}@2x.png >/dev/null
          done
          iconutil -c icns $ICONSET -o $APP/Contents/Resources/AppIcon.icns
          codesign --force --deep --sign - $APP
          codesign --verify --verbose $APP

      - name: Kurzer Starttest
        run: |
          build/Tastenklavier.app/Contents/MacOS/Tastenklavier &
          PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then echo "App läuft"; kill $PID; else echo "App ist abgestürzt"; exit 1; fi

      - name: DMG erstellen
        run: |
          mkdir -p build/dmg
          cp -R build/Tastenklavier.app build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Tastenklavier" -srcfolder build/dmg -ov -format UDZO build/Tastenklavier.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Tastenklavier-${{ env.VERSION }}
          path: build/Tastenklavier.dmg

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/Tastenklavier.dmg --title "Tastenklavier $VERSION" --notes-file RELEASE_NOTES.md
